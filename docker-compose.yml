version: "3.8"

services:
  # 1. Frontend
  frontend:
    build: ./frontend
    container_name: devops-prj-hcm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # 2. Backend
  backend:
    build: ./backend
    container_name: devops-prj-hcm-backend
    ports:
      - "8081:8080" # Ngoài 8081, trong 8080
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432 # Nội bộ gọi nhau cổng 5432
      - DB_NAME=tododb
      - DB_USER=postgres
      - DB_PASSWORD=123456
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Database
  postgres:
    image: postgres:15-alpine
    container_name: devops-prj-hcm-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=tododb
    ports:
      - "5438:5432" # Ngoài 5438 (để né 5432 cũ), trong 5432
    volumes:
      - postgres_data_hcm:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_hcm:
