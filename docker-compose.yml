services:
  # 1. Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend

  # 2. Backend Service
  backend:
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=tododb
      - DB_USER=postgres
      - DB_PASSWORD=123456
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Postgres Service
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=tododb
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

# 4. Lưu trữ data Database
volumes:
  postgres_data:
